{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">New company account</p><h1>Create your Tender Sathi workspace.</h1><p class="muted">One signup creates one company account. Multi-user invitations are intentionally not enabled yet.</p><form method="post" class="stack"><label>Company name<input name="company_name" required placeholder="Your construction company"></label><label>Email address<input type="email" name="email" required placeholder="you@company.com"></label><label>Password<input type="password" name="password" minlength="8" required placeholder="At least 8 characters"></label><button class="button" type="submit">Create account</button></form><p class="form-foot">Already registered? <a href="/login">Sign in</a></p></section>{% endblock %}
