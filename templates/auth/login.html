{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">Welcome back</p><h1>Sign in to your workspace.</h1><form method="post" class="stack"><input type="hidden" name="next" value="{{ next }}"><label>Email address<input type="email" name="email" required></label><label>Password<div class="password-input"><input type="password" name="password" required><button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg><svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18M10.6 6.2A10.5 10.5 0 0 1 12 6c6.5 0 10 6 10 6a18.7 18.7 0 0 1-3.1 3.7M6.2 6.2C3.6 8 2 12 2 12s3.5 6 10 6a10.4 10.4 0 0 0 4.1-.8M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></label><button class="button" type="submit">Sign in</button></form><div class="form-links"><a href="/forgot-password">Forgot password?</a><a href="/signup">Create an account</a></div></section>{% endblock %}
