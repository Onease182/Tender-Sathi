<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tender Sathi{% endblock %} · Tender Sathi</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Tender <span>Sathi</span></a>
    {% if user %}
      <nav class="topnav" aria-label="Account navigation">
        <a href="/dashboard">Dashboard</a>
        {% if user.is_admin %}<a href="/admin/nrb">Admin</a>{% endif %}
        <a href="/logout">Sign out</a>
      </nav>
    {% else %}
      <nav class="topnav"><a href="/login">Sign in</a><a class="button small" href="/signup">Create account</a></nav>
    {% endif %}
  </header>
  <main>
    {% for flash in flashes %}<div class="flash {{ flash.category }}">{{ flash.message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer"><span>Tender Sathi</span><span>Built for Nepali construction tender preparation</span></footer>
  <script src="/static/app.js"></script>
</body>
</html>
